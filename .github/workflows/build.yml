name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Codebase
        run: |
          if [ -f maldives_multivendor_codebase.zip ]; then
            unzip -o maldives_multivendor_codebase.zip
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Build APK
        run: |
          cd flutter_app
          flutter create . --platforms=android --org=mv.bazaar
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BazaarMV-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
